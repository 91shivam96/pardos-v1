      <!-- Enquiry form -->
      <section class="section enquiry" id="enquire">
        <div class="container enquiry__inner">
          <div>
            <h2 class="section__title section__title--left enquiry__title">
              Interested in Pardos Sakura?
            </h2>
            <div class="section__rule section__rule--left"></div>
            <p class="enquiry__text">
              Get floor plans, pricing, availability and project updates
              directly from our team. Share your details and we will get in
              touch shortly.
            </p>
            <div class="enquiry__contacts">
              <div class="enquiry__contact">
                <span class="enquiry__contact-icon">&#9990;</span>
                <span>
                  <span class="enquiry__contact-label">Call Us</span>
                  <a class="enquiry__contact-value" href="tel:+919911555960">+91 99115 55960</a>
                </span>
              </div>
              <div class="enquiry__contact">
                <span class="enquiry__contact-icon">&#9993;</span>
                <span>
                  <span class="enquiry__contact-label">Location</span>
                  <span class="enquiry__contact-value">Sector 90, New Gurgaon, Gurugram</span>
                </span>
              </div>
            </div>
          </div>
          <form class="enquiry__form" action="mailto:sales@pardos.in" method="get" enctype="text/plain">
            <div class="form__grid">
              <div class="form__group">
                <label class="form__label" for="name">Name</label>
                <input class="form__input" type="text" id="name" name="name" placeholder="Your name" required />
              </div>
              <div class="form__group">
                <label class="form__label" for="phone">Phone</label>
                <input class="form__input" type="tel" id="phone" name="phone" placeholder="+91 XXXXX XXXXX" required />
              </div>
              <div class="form__group form__group--full">
                <label class="form__label" for="email">Email</label>
                <input class="form__input" type="email" id="email" name="email" placeholder="you@example.com" />
              </div>
              <div class="form__group form__group--full">
                <label class="form__label" for="message">Message</label>
                <textarea class="form__textarea" id="message" name="message" placeholder="I am interested in Pardos Sakura…"></textarea>
              </div>
              <div class="form__group form__group--full">
                <button class="btn btn--gold btn--block form__submit" type="submit">Submit Enquiry</button>
              </div>
            </div>
          </form>
        </div>
      </section>
